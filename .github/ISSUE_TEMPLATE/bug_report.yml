name: Bug report
description: Something in Atom is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't attach your `atom.db` or a full JSON backup — they contain your personal session history.

  - type: input
    id: version
    attributes:
      label: Atom version
      description: Shown in Settings.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to check.
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Focus / timer
        - Standby Mode
        - Timeline
        - History
        - Reports / export
        - Streaks
        - Settings
        - Installer / startup
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a 25 minute timer
        2. Pause it, then close the window
        3. Reopen Atom
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Screenshots help a lot for visual problems.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Console output, a screen recording, or details about your Standby images.
    validations:
      required: false
