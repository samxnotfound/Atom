name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Atom ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
          releaseBody: |
            Windows 10/11 (64-bit) installers for Atom.

            | File | Notes |
            | --- | --- |
            | `Atom_*_x64-setup.exe` | Recommended. NSIS installer, no admin prompt. |
            | `Atom_*_x64_en-US.msi` | For managed or MSI-preferred installs. |

            **SmartScreen:** this installer is not code-signed, so Windows may show
            "Windows protected your PC". Click **More info → Run anyway** to continue.

            Atom runs fully offline. Your data stays in `%APPDATA%\Atom\atom.db`.
